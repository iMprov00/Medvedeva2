# Кеширование статики в nginx (CSS, JS, картинки)
# Подключите этот файл внутри server { } перед location / :
#
#   include /path/to/Medvedeva2/shared/nginx_static_cache.conf;
#
# Либо скопируйте блоки location в свой конфиг nginx.

# CSS и JS — кеш 1 день, проверка по If-Modified-Since (304)
location ~* ^/(css|js)/.+\.(css|js)$ {
    proxy_pass http://ВАШ_UPSTREAM;  # замените на ваш upstream (например 127.0.0.1:4567)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=86400";
    # nginx сам отдаёт Last-Modified из файла и отвечает 304 при совпадении If-Modified-Since
}

# Картинки — кеш 7 дней
location /images/ {
    proxy_pass http://ВАШ_UPSTREAM;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=604800";
}

